<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi ANEF</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup-header">
      <div>
        <h1>Suivi ANEF</h1>
        <p id="subtitle">Historique local de naturalisation</p>
      </div>
      <button id="export" type="button">Exporter</button>
    </header>

    <section class="current" id="current">
      <span class="muted">En attente des donnees ANEF</span>
    </section>

    <section>
      <h2>Changements observes</h2>
      <ol id="history" class="history"></ol>
    </section>

    <section>
      <h2>Etapes datees</h2>
      <ol id="timeline" class="history"></ol>
    </section>

    <footer>
      Les donnees restent uniquement dans le stockage Chrome de cet appareil.
    </footer>
  </main>
  <script src="status-data.js"></script>
  <script src="popup.js"></script>
</body>
</html>
